<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="寝室餐食">
<meta name="theme-color" content="#FBFAF7">
<script>
/* 先把主题定下来再解析样式，避免深色用户看到一闪而过的白底 */
(function(){
  try{
    var raw=localStorage.getItem("dorm-eat-v2");
    var t=raw?((JSON.parse(raw).set||{}).theme||"auto"):"auto";
    var d=t==="dark"||(t!=="light"&&window.matchMedia("(prefers-color-scheme:dark)").matches);
    document.documentElement.setAttribute("data-theme",d?"dark":"light");
    if(d)document.documentElement.style.colorScheme="dark";
  }catch(e){document.documentElement.setAttribute("data-theme","light")}
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>寝室餐食助手</title>
<style>
:root{--bg:#FBFAF7;--card:#fff;--line:#E8E5DC;--line2:#F4F2EC;--line3:#DCD8CC;
--ink:#2C2C2A;--ink2:#5F5E5A;--ink3:#6F6C63;--ink4:#B4B2A9;--on-ink:#fff;--navbg:rgba(251,250,247,.95);
--soft:#F1EFE8;--soft2:#E6E2D7;--hover:#F3F0E6;--inkpress:#414140;
--sat:0px;--sab:0px;--g:#3B6D11;--gs:#3B6D11;--gs-d:#31590E;--gl:#EAF3DE;--gm:#C0DD97;
--ok-ink:#2C5310;--warn-ink:#5A3806;--noticebg:#2C2C2A;--a-line:#F0DFC4;--g-line:#D6E8BD;--gl-d:#DFEBCE;
--a:#854F0B;--al:#FAEEDA;--r:#A32D2D;--rl:#FCEBEB;--r-line:#F2D2D2;--r-ink:#7A2222;--b:#185FA5;--bl:#E6F1FB;
--noticewarn:#8F2727}
/* 深色：由 html[data-theme] 决定（跟随系统 / 强制浅色 / 强制深色），
   head 里的内联脚本会在样式前写好这个属性，所以这里不再用 prefers-color-scheme */
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#141517;--card:#1D1E21;--line:#303136;--line2:#26272B;--line3:#3D3E44;
    --ink:#E9E7E2;--ink2:#BDB9B0;--ink3:#9C988F;--ink4:#6E6B63;--on-ink:#fff;--navbg:rgba(20,21,23,.96);
    --soft:#26272B;--soft2:#33343A;--hover:#26272B;--inkpress:#3A3B40;
    --g:#9CCB63;--gs:#3F7317;--gs-d:#4A8A1C;--gl:#233018;--gm:#3F5B27;--gl-d:#2C3F1D;--g-line:#3A5222;
    --ok-ink:#B9DD90;--warn-ink:#EBC98A;--noticebg:#2A2B2F;--noticewarn:#7D2A2A;
    --a:#E2AA5F;--al:#33270F;--a-line:#4A3A1B;
    --r:#EC9494;--rl:#332121;--r-line:#4A2E2E;--r-ink:#F2AAAA;
    --b:#8ABBEF;--bl:#17293D;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:86px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{padding:calc(14px + var(--sat)) 0 8px;position:sticky;top:0;background:var(--bg);z-index:9}
h1{font-size:19px;font-weight:600;letter-spacing:-.3px}
h1 .h1b{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;padding:2px 4px 2px 0;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit}
h1 .h1b:active{background:var(--hover);border-radius:8px}
h1 .hc{font-size:11px;color:var(--ink3);font-weight:400;transform:translateY(1px)}
.sub{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub .w{background:var(--bl);color:var(--b);padding:1px 7px;border-radius:5px;font-size:11px}
.sub .w.off{background:var(--soft);color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card h2 span{font-size:12px;font-weight:400;color:var(--ink3)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12px}
.bar-row .lb{width:38px;color:var(--ink3);flex:none;font-size:11.5px;white-space:nowrap}
.bar-row .tr{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar-row .fl{height:100%;border-radius:4px;transition:width .4s}
.bar-row .vl{width:92px;text-align:right;flex:none;color:var(--ink2);font-variant-numeric:tabular-nums}
.tip{background:var(--al);border:1px solid var(--a-line);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--warn-ink);margin-bottom:12px;line-height:1.55}
.tip.ok{background:var(--gl);border-color:var(--g-line);color:var(--ok-ink)}
.tip b{font-weight:600}
.rec{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--card);cursor:pointer;margin-bottom:9px}
.rec:active{background:var(--hover)}
.rec .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;gap:8px}
.rec .t b{font-size:14.5px;font-weight:600}
.rec .t em{font-size:11.5px;color:var(--ink3);font-style:normal;flex:none}
.rec .d{font-size:12.5px;color:var(--ink2);line-height:1.5}
.rec .mac{font-size:11.5px;color:var(--ink3);margin-top:5px;font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.badge{font-size:11px;padding:1.5px 7px;border-radius:5px;background:var(--gl);color:var(--g)}
.badge.warn{background:var(--rl);color:var(--r)}
.badge.info{background:var(--bl);color:var(--b)}
.badge.mut{background:var(--soft);color:var(--ink2)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;padding:5px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}   /* 深色下 --ink 是浅色，白字会看不见 */
input[type=search],input[type=number],select{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font:15px inherit;background:var(--card);color:var(--ink);outline:none;font-family:inherit}
input[type=search]:focus,input[type=number]:focus,select:focus{border-color:var(--gm)}
textarea{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font:15px/1.6 inherit;font-family:inherit;min-height:76px;resize:vertical;outline:none;background:var(--card);color:var(--ink)}
textarea:focus{border-color:var(--gm)}
.food{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.food:last-child{border-bottom:none}
.food .info{flex:1;min-width:0}
.food .nm{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.food .mt{font-size:11.5px;color:var(--ink3);margin-top:1px;line-height:1.45}
.add{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 11px;font-size:12.5px;color:var(--g);cursor:pointer;flex:none;font-family:inherit;font-weight:500}
.add:active{background:var(--gl)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--navbg);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:20}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:none;font-family:inherit;font-size:11.5px;color:var(--ink3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
nav button .ic{width:22px;height:22px;display:block;opacity:.5;transition:opacity .15s}
nav button .ic svg{display:block;width:22px;height:22px}
nav button.on{color:var(--ink)}
nav button.on .ic{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:55;display:none;align-items:flex-end;justify-content:center;padding-bottom:var(--kb,0px)}
.sheet.on{display:flex;animation:maskIn .28s ease both}
.sheet.closing{animation:maskOut .26s ease both}
.sheet .box{outline:none;background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px max(20px,env(safe-area-inset-bottom));max-height:calc(90vh - var(--kb,0px));overflow-y:auto;overscroll-behavior:contain;transition:transform .2s ease;transform-origin:50% 100%;will-change:transform}
/* 弹层盒子的动画一律用内联 style 控制：CSS 里再挂一条会在重绘时重播，看起来像"重新打开" */
.sheet.closing .box{animation:sheetDown .30s cubic-bezier(.42,0,.86,.5) both}
@keyframes maskIn{from{background:rgba(0,0,0,0)}to{background:rgba(0,0,0,.32)}}
@keyframes maskOut{from{background:rgba(0,0,0,.32)}to{background:rgba(0,0,0,0)}}
@keyframes sheetUp{
  0%{transform:translateY(76px) scale(.962);opacity:0;animation-timing-function:cubic-bezier(.14,.86,.26,1)}
  62%{transform:translateY(-6px) scale(1.004);opacity:1;animation-timing-function:cubic-bezier(.3,.6,.45,1)}
  82%{transform:translateY(2px) scale(1);animation-timing-function:ease-out}
  100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes sheetDown{from{transform:none;opacity:1}to{transform:translateY(80px) scale(.985);opacity:0}}
/* 换层：只让内容横向轻移，不做透明度变化——淡入在深色面板上就是"闪一下" */
@keyframes sheetInR{from{transform:translateX(20px)}to{transform:none}}
@keyframes sheetInL{from{transform:translateX(-20px)}to{transform:none}}
.sheet .sheetIn.inR{animation:sheetInR .2s cubic-bezier(.22,1,.36,1) both}
.sheet .sheetIn.inL{animation:sheetInL .2s cubic-bezier(.22,1,.36,1) both}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-size:16.5px;font-weight:600;margin-bottom:3px;padding-right:30px}
.sheet .sm{font-size:12.5px;color:var(--ink3);margin-bottom:12px;line-height:1.5}
.x{position:absolute;right:16px;top:16px;width:28px;height:28px;border-radius:50%;border:none;background:var(--soft);font-size:16px;color:var(--ink2);cursor:pointer;line-height:1}
.opt{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:7px;cursor:pointer}
.opt.on{border-color:var(--g);background:var(--gl)}
.opt .on1{flex:1;font-size:14px}
.opt input{width:62px;padding:4px 6px;font-size:13px;text-align:right;border:1px solid var(--line);border-radius:6px;font-family:inherit}
.preview{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:13px}
.preview .l{display:flex;justify-content:space-between;padding:2px 0}
.btn{width:100%;padding:13px;border-radius:11px;border:none;background:var(--gs);color:var(--on-ink);font-size:15px;font-weight:500;font-family:inherit;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink2);border:1px solid var(--line)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.setrow{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.setrow:last-child{border-bottom:none}
.setrow:active{background:var(--hover)}
.setrow .t{flex:1;min-width:0}
.setrow .t b{display:block;font-size:14.5px;font-weight:500}
.setrow .t em{display:block;font-size:11.5px;color:var(--ink3);font-style:normal;margin-top:2px;line-height:1.4}
.setrow .ar{color:var(--ink4);font-size:17px;flex:none}
/* ===== 动效 ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
#view.anim{animation:fadeUp .26s cubic-bezier(.22,.9,.3,1) both}
.btn,.rec,.add,.chip,.setrow,.opt,.x,.backb,.food[onclick],.stat .s[onclick],nav button{transition:transform .12s ease,background-color .12s ease,border-color .12s ease,opacity .12s ease,color .12s ease}
/* 按压：颜色稍变深 —— 全站统一手感 */
.btn:active{transform:scale(.975);background:var(--gs-d)}
.btn.ghost:active{background:var(--hover);border-color:var(--line3);color:var(--ink)}
.rec:active{transform:scale(.988);background:var(--hover);border-color:var(--line3)}
.add:active{transform:scale(.94);background:var(--gl);border-color:var(--gm)}
.chip:active{transform:scale(.94);background:var(--hover);border-color:var(--line3)}
.chip.on:active{background:var(--inkpress);border-color:var(--inkpress)}
.setrow:active{background:var(--hover)}
.setrow:active .ar{color:var(--ink2);transform:translateX(2px)}
.opt:active{background:var(--hover);border-color:var(--line3)}
.opt.on:active{background:var(--gl-d)}
.x:active{background:var(--soft2);transform:scale(.94)}
.backb:active{color:var(--ok-ink);opacity:.72}
.food[onclick]{cursor:pointer;padding-left:8px;padding-right:8px;margin-left:-8px;margin-right:-8px;border-radius:9px}
.food[onclick]:active{background:var(--hover)}
.stat .s[onclick]{cursor:pointer}
.stat .s[onclick]:active{background:var(--hover);border-color:var(--line3);transform:scale(.985)}
nav button:active{color:var(--ink2)}
nav button:active .ic{opacity:.78}
.ar{transition:transform .12s ease,color .12s ease}
@keyframes pop{0%{transform:scale(1)}42%{transform:scale(1.18)}100%{transform:scale(1)}}
nav button.on .ic{animation:pop .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.empty.loading{animation:breathe 1.5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{width:0}}
.bar-row .fl{animation:grow .62s cubic-bezier(.22,.9,.3,1) both}
/* 日视图三页是预先渲染好的，翻页时不该再"长一遍"，否则像重新刷新 */
.pane .bar-row .fl{animation:none}
header{transition:box-shadow .22s ease}
header.scrolled{box-shadow:0 1px 0 var(--line),0 6px 16px -12px rgba(0,0,0,.28)}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:7px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
.sethead{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.sethead h1{font-size:19px;font-weight:600;margin:0}
.backb{border:none;background:none;font-family:inherit;font-size:14px;color:var(--g);padding:4px 2px;cursor:pointer}
.stat .s{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.stat .s .k{font-size:11.5px;color:var(--ink3)}
.stat .s .v{font-size:17px;font-weight:600;letter-spacing:-.3px}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:24px 0;line-height:1.6}
.logitem{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line2);gap:8px}
.logitem:last-child{border-bottom:none}
.logitem .r{color:var(--ink3);font-size:11.5px;flex:none;text-align:right;line-height:1.45}
.steps{counter-reset:s;list-style:none;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding-left:24px;margin-bottom:7px;font-size:13.5px;line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:17px;height:17px;border-radius:50%;background:var(--gl);color:var(--g);font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
label.fl{display:block;font-size:12.5px;color:var(--ink3);margin:12px 0 5px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{font-size:12px;color:var(--ink3);margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.sec b{font-weight:600;color:var(--ink2)}
.sec span{margin-left:auto;font-size:11.5px;color:var(--ink4)}
.ing{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line2)}
.ing:last-child{border-bottom:none}
.ing .q{color:var(--ink3);font-size:12.5px;flex:none;margin-left:10px}
#splash{position:fixed;left:0;top:0;right:0;bottom:0;padding-top:var(--sat);background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .42s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .sp-in{display:flex;align-items:center;justify-content:center}
#splash .bowl{animation:bowlIn .5s cubic-bezier(.22,.9,.3,1) both}
#splash .steam path{stroke-dasharray:26 60;stroke-dashoffset:26;opacity:0;animation:steamDraw .62s ease forwards}
#splash .steam path:nth-child(1){animation-delay:.60s}
#splash .steam path:nth-child(2){animation-delay:.72s}
#splash .steam path:nth-child(3){animation-delay:.84s}
#splash .soup{opacity:0;animation:soupIn .5s .34s ease forwards}
@keyframes bowlIn{0%{opacity:0;transform:translateY(11px) scale(.86)}70%{opacity:1;transform:translateY(0) scale(1.015)}100%{opacity:1;transform:none}}
@keyframes steamDraw{0%{stroke-dashoffset:26;opacity:0}35%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes soupIn{to{opacity:1}}
/* 顶部提示条：保存失败 / 有新版本 / 数据修复 */
#notice{position:fixed;left:0;right:0;top:0;z-index:70;display:flex;align-items:center;gap:10px;
  padding:calc(var(--sat) + 9px) 14px 9px;background:var(--ink);color:var(--card);font-size:13px;line-height:1.5;
  transform:translateY(-102%);transition:transform .3s cubic-bezier(.22,.9,.3,1);box-shadow:0 10px 24px -16px rgba(0,0,0,.6)}
#notice.on{transform:none}
#notice.warn{background:var(--noticewarn)}
#notice b{font-weight:600}
#notice button{flex:none;margin-left:auto;background:rgba(255,255,255,.16);border:none;color:var(--card);font-family:inherit;
  font-size:12.5px;padding:6px 12px;border-radius:9px;cursor:pointer;transition:background .12s ease}
#notice button:active{background:rgba(255,255,255,.3)}
/* ===== 整页覆盖层（日视图 / 趋势） ===== */
.page{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:28px;will-change:transform,opacity}
.page.on{display:block;animation:pageIn .28s cubic-bezier(.22,1,.36,1) both}
.page.closing{animation:pageOut .26s cubic-bezier(.4,0,.2,1) both}
@keyframes pageIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pageOut{from{transform:none}to{transform:translateX(100%)}}
/* 逐级返回：当前内容先向右滑出，再把上一层接回来 */
#pageIn.slideout{animation:slideOutR .19s cubic-bezier(.4,0,.7,.3) both}
@keyframes slideOutR{from{opacity:1;transform:none}to{opacity:.2;transform:translateX(34px)}}
/* 逐级返回：上一层接回来时的轻度回位 */
.page.backstep #pageIn{animation:pageBack .18s ease both}
@keyframes pageBack{from{opacity:.45;transform:translateX(-14px)}to{opacity:1;transform:none}}
/* 日视图换天数：内容按方向滑入 */
/* 日视图横向分页：一次渲染「前一天 / 当天 / 后一天」三页，拖动时邻居跟着进来 */
.pager{overflow:hidden;position:relative}
.pager .track{display:flex;width:300%;align-items:flex-start;will-change:transform;transform:translateX(-33.3333%)}
.pager .pane{flex:0 0 33.3333%;width:33.3333%;min-width:0}
#pageIn.pushIn{animation:pushIn .26s cubic-bezier(.22,1,.36,1) both}
@keyframes pushIn{from{transform:translateX(46px)}to{transform:none}}
#pageIn.slideL{animation:slideInL .2s cubic-bezier(.22,1,.36,1) both}
#pageIn.slideR{animation:slideInR .2s cubic-bezier(.22,1,.36,1) both}
@keyframes slideInL{from{opacity:.4;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideInR{from{opacity:.4;transform:translateX(-28px)}to{opacity:1;transform:none}}
.phead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;
  padding:calc(10px + var(--sat)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.phead .ttl{flex:1;min-width:0;font-size:15px;font-weight:600;text-align:center}

.chart .b{width:100%;max-width:14px;background:var(--gm);border-radius:3px 3px 0 0;transition:background .12s ease}
.chart .col.on .b{background:var(--g)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}

.cal .d.off{opacity:.25;cursor:default}

<script type="application/json" id="d-recipes">[{"n":"水煮蛋配蒸红薯","c":"早","t":20,"d":"一锅两层，蛋和主食同时出","m":["鸡蛋","红薯"],"o":[],"s":["红薯刷洗干净，不去皮，切成 2cm 厚片，太厚中心难熟","锅加 600ml 冷水，鸡蛋直接放进去，不必等水开","蒸格架在鸡蛋上方，铺上红薯片，盖盖","最大档烧开，水开后开始计时","中档煮 10 分钟，中途别开盖跑汽","第 10 分钟用筷子戳红薯最厚处检验","鸡蛋捞出立刻放进冷水泡 1 分钟","红薯取出稍晾 2 分钟再吃"],"chk":"筷子能轻松穿透红薯最厚处、无硬芯；鸡蛋过冷水后一敲壳整片脱落","bad":"红薯切太厚会外烂内生；鸡蛋不过冷水，壳会粘住蛋白剥不干净","k":0,"tip":"红薯切2cm块熟得更快，筷子能穿透即可"},{"n":"蒸蛋羹","c":"早","t":15,"d":"蛋液兑1.5倍温水，滑嫩不起蜂窝","m":["鸡蛋"],"o":["虾皮"],"s":["2 个鸡蛋打入碗中，打到看不见蛋筋为止","加 1.5 倍温水（约 130ml），水温摸起来不烫手","顺着一个方向搅匀，别用力打出一堆泡","用勺子把表面浮沫撇干净，这步决定表面平不平","蛋液过一遍筛更细腻，没有筛可跳过","碗上倒扣一个盘子，防止水汽滴落打出蜂窝","水开后放进锅里，中档蒸 10 分钟","关火后焖 2 分钟再开盖，避免骤冷回缩","淋几滴生抽，撒一点虾皮提鲜"],"chk":"表面平整无蜂窝，勺子轻压中间有弹性、不渗水","bad":"用冷水或水加太少，蛋羹会老且硬；火太大或不盖盘子必起蜂窝","k":0,"tip":"盖盘子比保鲜膜省事，也不会滴水"},{"n":"燕麦豆浆杯","c":"早","t":6,"d":"不用开火，热水一冲就行","m":["燕麦","豆浆"],"o":["核桃"],"s":["燕麦 40g 倒进碗里","烧 200ml 沸水，冲入燕麦，水量要完全没过","盖个盘子焖 3 分钟，让燕麦充分吸水","掀开搅一下，看是否已经糊化发稠","倒入豆浆 250ml，搅拌均匀","豆浆是凉的，会把整碗带温，想热喝多一步","连碗放回锅里隔水焐 2 分钟即可回温","撒核桃碎，掰小块口感更好"],"chk":"燕麦吸饱水、舀起来挂勺不稀汤","bad":"直接拿凉豆浆泡不软，必须先用水焖；水太少会干硬结块","k":0,"tip":"先用水焖软，再加豆浆口感更顺"},{"n":"酸奶燕麦杯","c":"免","t":3,"d":"完全免煮，前一晚也能做","m":["燕麦","酸奶"],"o":["苹果","核桃"],"s":["燕麦 40g 倒进碗里","先加 2 勺酸奶拌一下，让每片燕麦都沾到","把剩下的酸奶全部倒入","拌匀后静置 3 分钟，让燕麦吸水变软","苹果洗净带皮切 1cm 小丁，别切太大","苹果丁铺在表面，吃前再拌避免出水","撒核桃碎增加口感","想更饱腹可冷藏 10 分钟再吃"],"chk":"燕麦吸酸奶后变软、不硌牙，碗底无多余渗水","bad":"只有即食燕麦适合免煮；生燕麦片泡不软，会硌牙且难消化","k":1,"tip":"选无糖酸奶，风味款通常多30kcal以上"},{"n":"小米粥","c":"早","t":25,"d":"养胃，配个蛋就是完整早餐","m":["小米"],"o":[],"s":["小米 50g 用清水轻轻淘一遍，别反复搓洗","淘完沥干水分，不要泡","锅加 500ml 冷水，直接下小米","最大档烧开，这期间锅盖别盖严，很容易溢","水开后转最小档，锅盖留一条缝","煮 20 分钟，中途搅 2 次防止粘底","看到米粒开花、汤色发黄变稠就好","关火再焖 3 分钟，口感更糯"],"chk":"米粒开花、汤体浓稠，勺子背能挂住一层米汤","bad":"全程大火会溢锅糊底；水开前盖严必溢；淘洗过度会损失香味","k":0,"tip":"水开后可开盖留条缝，防止溢锅"},{"n":"玉米配水煮蛋","c":"早","t":18,"d":"最省心的组合，几乎不用管","m":["玉米","鸡蛋"],"o":[],"s":["玉米剥掉外层老皮，保留最里面一层薄皮","切成 2-3 段，段越短熟得越快","冷水下锅，水量与玉米齐平","鸡蛋一起放进去，冷水下锅不易裂壳","最大档烧开，水开后开始计时","中档煮 10 分钟","关火焖 2 分钟让玉米更入味","玉米捞出，鸡蛋立刻过冷水"],"chk":"玉米粒饱满发亮、指甲掐有汁；蛋黄完全凝固不流心","bad":"水开后才下蛋容易裂壳流白       kw:r[10],kc:r[11],label:r[12],src:r[13],note:r[14],na:r[15],ca:r[16],fe:r[17],vc:r[18],chol:r[19]};
  });
  /* 自建食材用固定 id（≥1000），不再按数组下标现编：删掉中间一条，后面的不会整体前移 */
  const list=((typeof S!=="undefined"&&S&&S.myFood)||[]);
  const used={};
  list.forEach(function(x){if(+x.id>=1000)used[+x.id]=1});
  let next=1000;
  list.forEach(function(x){
    if(!(+x.id>=1000)){
      while(used[next])next++;
      x.id=next;used[next]=1;
    }
    F.push({id:x.id,n:x.n,cat:x.cat||"protein",kcal:+x.kcal||0,p:+x.p||0,f:+x.f||0,c:+x.c||0,fib:+x.fib||0,
      un:x.un||"份",ug:+x.ug||100,e:100,kw:365,kc:365,label:"净重",src:x.src||"自建食材（非成分表）",
      note:x.note||"",na:+x.na||0,ca:0,fe:0,vc:0,chol:0,my:true});
  });
  BY={};
  F.forEach(function(f){BY[f.n]=f});
  /* 库存/浪费条目补上食材名：以后 RAW 顺序变了也认得出来是谁 */
  if(typeof S!=="undefined"&&S){
    (S.inv||[]).forEach(function(x){if(!x.n&&F[x.id])x.n=F[x.id].n});
    (S.waste||[]).forEach(function(x){if(!x.n&&F[x.id])x.n=F[x.id].n});
  }
}
/* 统一入口：条目 → 食材（优先认名字，id 只作兜底） */
function foodOf(x){
  if(!x)return null;
  return (x.n&&BY[x.n])||F[x.id]||null;
}
function foodName(x){const f=foodOf(x);return f?f.n:""}

/* ===== 食材互认：同一类可以顶替（目前只处理食用油） =====
   宿舍里买什么油是随机的，但橄榄油/大豆油/花生油的热量差别 <2%，
   不该因为"食谱写了橄榄油"就判定你没油。 */
function isOil(n){const f=BY[n];return !!(f&&f.cat==="fat"&&/油$/.test(f.n))}
function stockOils(){
  return S.inv.filter(function(x){const f=foodOf(x);return f&&f.cat==="fat"&&/油$/.test(f.n)&&x.g>0.5})
    .sort(function(a,b){return b.g-a.g});
}
/* 这个食材用什么满足：自己有就自己，油类则用库存最多的那种油；都没有返回 null */
function supplyOf(n){
  if(invQty(n)>0)return n;
  if(isOil(n)){
    const oils=stockOils();
    if(oils.length)return foodName(oils[0]);
  }
  return null;
}
function haveIng(n){return !!supplyOf(n)}
function ALL(){
  const base=RCP.concat(S.myRcp||[]);
  (S.myDish||[]).forEach(function(d,k){
    base.push({n:d.n,c:"主",t:20,d:d.note||"",
      m:(d.i||[]).map(function(x){return x[0]}),o:[],s:d.s||[],
      chk:"",bad:"",tip:"",myDishIdx:k});
  });
  return base;
}
const ALIAS={"柚子":"柚","蒜":"大蒜","蒜头":"大蒜","芝麻":"芝麻子","藕":"莲藕","西红柿":"番茄","洋芋":"土豆","地瓜":"红薯","山芋":"红薯","圆白菜":"包菜","卷心菜":"包菜","洋白菜":"包菜","青菜":"小白菜","面条":"挂面","鸡胸":"鸡胸肉","柿子椒":"甜椒","西柚":"葡萄柚","薯仔":"土豆","白薯":"红薯","花菜":"菜花","白菜":"大白菜","豌豆尖":"豌豆苗","海带菜":"海带","酱油":"生抽","老醋":"醋","米醋":"醋","淀粉":"淀粉","生粉":"淀粉","荞麦面条":"荞麦面","荞面条":"荞麦面","荞麦冷面":"荞麦面","荞面":"荞麦面",

/* ---------- 顶部提示条（保存失败 / 新版本 / 数据修复共用） ---------- */
function notice(msg,opt){
  opt=opt||{};
  let el=document.getElementById("notice");
  if(!el){el=document.createElement("div");el.id="notice";el.setAttribute("role","status");el.setAttribute("aria-live","polite");document.body.appendChild(el)}
  el.className="notice"+(opt.warn?" warn":"");
  el.innerHTML='<span style="flex:1;min-width:0">'+msg+'</span>'+(opt.action?'<button>'+opt.action+'</button>':"");
  if(opt.action){el.querySelector("button").onclick=opt.onAction||hideNotice}
  /* 点文字也能收起，避免存储满载时的常驻条永久压住标题 */
  el.querySelector("span").onclick=hideNotice;
  void el.offsetWidth;
  el.classList.add("on");
  if(notice._t)clearTimeout(notice._t);
  if(!opt.sticky)notice._t=setTimeout(hideNotice,opt.ms||6500);
}
function hideNotice(){const el=document.getElementById("notice");if(el)el.classList.remove("on")}

/* ===== 可访问性：不侵入渲染逻辑，render 后统一补语义 ===== */
function a11yPatch(scope){
  const root=scope||document.getElementById("view");
  if(!root)return;
  root.querySelectorAll("[onclick]").forEach(function(el){
    if(/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(el.tagName))return;
    if(!el.hasAttribute("role"))el.setAttribute("role","button");
    if(!el.hasAttribute("tabindex"))el.setAttribute("tabindex","0");
  });
  /* label.fl 没有 for，把文字补成相邻输入框的 aria-label */
  root.querySelectorAll("label.fl").forEach(function(lb){
    const t=(lb.textContent||"").trim();
    if(!t)return;
    const nx=lb.nextElementSibling;
    if(!nx)return;
    const f=nx.matches("input,select,textarea")?nx:nx.querySelector("input,select,textarea");
    if(f&&!f.getAttribute("aria-label"))f.setAttribute("aria-label",t);
  });
  if(root.id==="view"){
    document.querySelectorAll("nav button").forEach(function(b){
      if(b.classList.contains("on"))b.setAttribute("aria-current","page");
      else b.removeAttribute("aria-current");
    });
  }
}
/* 键盘能操作「长得像按钮的 div」 */
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ")return;
  const el=document.activeElement;
  if(!el||el.getAttribute("role")!=="button")return;
  if(/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(el.tagName))return;

});

/* ---------- 状态：默认值 + 迁移 ---------- */
function defaultState(){
  return {v:3,inv:[],logs:[],waste:[],myRcp:[],myDish:[],myFood:[],nextFoodId:1000,shop:[],lastUpd:0,ai:{},
    set:{sex:"女",height:165,age:22,weight:60,act:1.375,kcal:1470,protein:96,fat:48,carb:163,
         na:2000,locked:false,city:"",lat:null,lon:null,offset:3,theme:"auto"},
    w:{t:null,avg3:null,src:"init",at:0}};
}
/* 老备份 / 残缺数据一律补全默认值：缺 set、缺 waste 都不会再白屏 */
function mergeState(r){
  const d=defaultState();
  if(!r||typeof r!=="object")return d;
  const out=Object.assign(d,r);
  out.set=Object.assign(defaultState().set,r.set||{});
  out.ai=Object.assign({},r.ai||{});
  out.w=Object.assign(defaultState().w,r.w||{});
  ["inv","logs","waste","myRcp","myDish","myFood","shop"].forEach(function(k){if(!Array.isArray(out[k]))out[k]=[]});
  out.v=3;
  return out;
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(K)}catch(e){}
  if(!raw)return defaultState();
  try{
    const r=JSON.parse(raw);
    if(r&&r.inv)return mergeState(r);
  }catch(e){}
  /* 解析失败：绝不就地覆盖，先留一份原始串，再进空状态 */
  try{localStorage.setItem(K+".broken",raw)}catch(e){}
  setTimeout(function(){
    notice("本机数据读不出来，原始内容已存为 "+K+".broken。可到「设置 → 数据」恢复备份，或清空重来。",{warn:true,sticky:true});
  },0);
  return defaultState();
}
let saveWarned=false;
function save(){

    localStorage.setItem(K,JSON.stringify(S));
    if(saveWarned){saveWarned=false;hideNotice()}   /* 存储恢复后自动收起警告条 */
  }catch(e){
    if(saveWarned)return;

        {warn:true,sticky:true,action:"去导出",onAction:function(){hideNotice();setTab("set");openSetData()}});
    },0);
  }
}
function dstr(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function today(){return dstr(new Date())}
function daysAgo(s){const a=new Date(s+"T00:00:00"),b=new Date(today()+"T00:00:00");return Math.round((b-a)/864e5)}
function calcTargets(){
  const s=S.set;if(s.locked)return;
  const bmr=10*s.weight+6.25*s.height-5*s.age+(s.sex==="男"?5:-161);
  const tdee=bmr*s.act;
  s.kcal=Math.max(1200,Math.round(tdee-400));
  s.protein=Math.round(s.weight*1.6);
  s.fat=Math.round(s.weight*0.8);
  s.carb=Math.max(0,Math.round((s.kcal-4*s.protein-9*s.fat)/4));
}
function roomT(){const o=+S.set.offset;return S.w.t==null?null:S.w.t+(isNaN(o)?3:o)}  /* 偏移填 0 要生效，别被 || 当成空值 */
function keepDays(f){
  const rt=roomT();
  if(rt==null){const m=new Date().getMonth()+1;return (m>=6&&m<=9)?f.kw:f.kc}
  let b;
  if(rt<=10)b=Math.floor(f.kc*1.2);else if(rt<=20)b=f.kc;else if(rt<=26)b=Math.floor((f.kc+f.kw)/2);
  else if(rt<=32)b=f.kw;else b=Math.floor(f.kw*0.8);
  return Math.max(0,b);
}
function remDays(it){const f=foodOf(it);return (f?keepDays(f):0)-daysAgo(it.d)}
function invQty(name){return S.inv.filter(x=>foodName(x)===name).reduce((a,b)=>a+b.g,0)}
function invItem(id){const f=F[id];return f?invQty(f.n):0}
function expireList(){return S.inv.filter(x=>foodOf(x)).map(x=>({...x,rem:remDays(x)})).filter(x=>x.rem<=0).sort((a,b)=>a.rem-b.rem)}
function eatenToday(){
  const t=today();
  return S.logs.filter(l=>l.d===t).reduce((a,l)=>({kcal:a.kcal+(l.kcal||0),p:a.p+(l.p||0),f:a.f+(l.f||0),c:a.c+(l.c||0),na:a.na+(l.na||0),veg:a.veg+(l.veg||0)}),{kcal:0,p:0,f:0,c:0,na:0,veg:0});
}
function rcpMacro(r){
  let k=0,p=0,f=0,c=0,na=0;
  r.m.forEach(n=>{const x=BY[n];if(!x)return;const g=x.ug;k+=x.kcal*g/100;p+=x.p*g/100;f+=x.f*g/100;c+=x.c*g/100;na+=(x.na||0)*g/100});
  return {kcal:Math.round(k),p:Math.round(p),f:Math.round(f),c:Math.round(c),na:Math.round(na)};
}
function macOfRcp(r){
  if(r.myDishIdx==null)return rcpMacro(r);
  const d=(S.myDish||[])[r.myDishIdx];
  if(!d)return rcpMacro(r);
  let k=0,p=0,f=0,c=0,g=0,na=0;
  (d.i||[]).forEach(function(it){
    const x=BY[it[0]];if(!x)return;
    k+=x.kcal*it[1]/100;p+=x.p*it[1]/100;f+=x.f*it[1]/100;c+=x.c*it[1]/100;g+=it[1];na+=(x.na||0)*it[1]/100;
  });
  return {kcal:Math.round(k),p:Math.round(p),f:Math.round(f),c:Math.round(c),g:Math.round(g),na:Math.round(na)};
}
function recommend(kw){
  const k=String(kw||"").trim();
  const exp=expireList().map(foodName);
  const recent={};S.logs.filter(l=>daysAgo(l.d)<=2).forEach(l=>{const n=l.name.split("（")[0];recent[n]=(recent[n]||0)+1});
  const now=[],near=[];
  ALL().forEach((r,i)=>{
    if(k){
      const hay=[r.n].concat(r.m||[]).concat(r.o||[]).join("|");
      if(hay.indexOf(k)<0)return;
    }
    const miss=r.m.filter(n=>!haveIng(n));
    let sc=r.m.length*2+(r.o||[]).filter(haveIng).length;
    miss.forEach(n=>{if(exp.indexOf(n)>-1)sc+=3});
    r.m.forEach(n=>{if(exp.indexOf(n)>-1)sc+=6});
    const mac=macOfRcp(r);
    sc+=mac.p/8;
    if(recent[r.n])sc-=recent[r.n]*4;
    if(r.t>25)sc-=1;
    const item={i,sc,mac,miss,r};
    if(!miss.length)now.push(item);
    else if(k||(miss.length<=2&&r.m.length>miss.length))near.push(item);
  });
  now.sort((a,b)=>b.sc-a.sc);near.sort((a,b)=>a.miss.length-b.miss.length||b.sc-a.sc);
  return {now:now.slice(0,k?40:4),near:near.slice(0,k?20:3),kw:k};
}

    advise=r<0?`<b>${f.n}</b> 已过期 ${-r} 天，别再吃了。`:`<b>${f.n}</b> ${r===0?"今天是最后一天":"还剩 "+r+" 天"}，优先用掉。`;
  }else if(pLeft>20)advise=`今天蛋白还差 <b>${pLeft}g</b>，下一餐优先补一份蛋白。`;
  else if(kLeft>300)advise=`蛋白够了，热量还有 <b>${kLeft} kcal</b> 余量，可以安排主食和蔬菜。`;
  else advise=`今天的缺口基本填满了，加餐别再加主食。`;

  let h=dailyBrief()+`<div class="card"><h2>今日摄入<span>${today()}</span></h2><div class="bars">
    ${bar("热量",e.kcal,sg.kcal,"#3B6D11")}
    ${bar("蛋白",e.p,sg.protein,"#1D9E75")}
    ${bar("碳水",e.c,sg.carb,"#378ADD")}
    ${bar("脂肪",e.f,sg.fat,"#BA7517")}
    ${bar("钠 mg",e.na,sg.na||2000,"#993C1D")}
  </div></div>
  <div class="tip ${exp.length?"":"ok"}">${exp.length?"⏳ ":"✓ "}${advise}</div>`;

  /* 今天吃了：紧接「今日摄入」下方，按餐次分组，点条目看明细、点标题看整天 */
  const tl=S.logs.filter(l=>l.d===today());
  if(tl.length){
    const tk=tl.reduce((a,l)=>a+(l.kcal||0),0);
    h+=`<div class="card"><h2 onclick="openDay(today())" style="cursor:pointer">今天吃了<span>${tl.length} 次 · ${Math.round(tk)} kcal ›</span></h2>`;
    ["早","午","晚","加",""].forEach(mk=>{
      const items=tl.filter(l=>(MEALS.indexOf(l.m)>=0?l.m:"")===mk);
      if(!items.length)return;
      const kk=items.reduce((a,l)=>a+(l.kcal||0),0);
      const pp=items.reduce((a,l)=>a+(l.p||0),0);
      const share=tk>0?Math.round(kk/tk*100):0;
      h+=`<div class="sec" style="margin:8px 0 2px"><b>${MEAL_LABEL[mk]}</b><span>${Math.round(kk)} kcal · ${share}% · 蛋白 ${Math.round(pp)}g</span></div>`;
      items.forEach(l=>{
        const li=S.logs.indexOf(l);
        h+=`<div class="food" onclick="openLogDetail(${li})"><div class="info">
          <div class="nm">${esc(l.name)}</div>
          <div class="mt">${Math.round(l.kcal)} kcal · 蛋白 ${Math.round(l.p)}g · 碳水 ${Math.round(l.c||0)}g · 脂肪 ${Math.round(l.f||0)}g</div>
        </div><span style="color:var(--ink4);font-size:16px">›</span></div>`;
      });
    });
    h+=`</div>`;
  }

  h+=`<div class="card"><h2>现在就能做<span>库存齐全 · ${rec.now.length} 道</span></h2>`;
  if(!rec.now.length)h+=`<div class="empty">库存还配不成一道完整的菜<br>去「食材」页加几样</div>`;
  rec.now.forEach(x=>{
    h+=`<div class="rec" onclick="openRcp(${x.i})">
      <div class="t"><b>${x.r.n}</b><em>${x.r.t} 分钟</em></div>
      <div class="d">${x.r.d||""}</div>
      <div class="mac">${macLine(x.mac)}</div>
      <div class="badges">${x.r.k?'<span class="badge mut">免开火</span>':''}
        ${x.r.m.filter(n=>exp.some(e2=>F[e2.id].n===n)).map(n=>`<span class="badge warn">用掉临期：${n}</span>`).join("")}
      </div></div>`;
  });
  h+=`</div>`;

  if(rec.near.length){
    h+=`<div class="card"><h2>差一样就能做<span>标的是需要买的</span></h2>`;
    rec.near.forEach(x=>{
      h+=`<div class="rec" onclick="openRcp(${x.i})">
        <div class="t"><b>${x.r.n}</b><em>${x.r.t} 分钟</em></div>
        <div class="mac">${macLine(x.mac)}</div>
        <div class="badges">${x.miss.map(n=>`<span class="badge warn">需买：${n}</span>`).join("")}</div>
      </div>`;
    });
    h+=`</div>`;
  }

  return h;
}

function rcpMatch(r,kw){
  if(!kw)return true;
  if(r.n.indexOf(kw)>-1)return true;
  if(r.m.some(n=>n.indexOf(kw)>-1))return true;
  return (r.o||[]).some(n=>n.indexOf(kw)>-1);
}

function runRecognize(kind,text,b64){
  if(!S.ai||!S.ai.key){alert("需要先在「记录」页填 AI 接口和 Key");return}

    content=[{type:"text",text:recipePrompt()},
             {type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b64}}];

  }

function aiContentOf(t){
  const d=JSON.parse(t);
  let c=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
  c=c.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const i=c.indexOf("{"),j=c.lastIndexOf("}");
  if(i>-1&&j>i)c=c.slice(i,j+1);
  return JSON.parse(c);
}
function handleRecipe(t){
  if(!t||String(t).indexOf("err:")===0){
    openSheet('<h3>识别失败</h3><div class="tip">'+esc(String(t||"").slice(0,200))+'</div>'
      +'<button class="btn ghost" onclick="renderNewRcp()">返回手填</button>');
    return;
  }
  let obj=null;
  try{obj=aiContentOf(t)}catch(e){
    openSheet('<h3>识别失败</h3><div class="tip">返回内容不是合法 JSON，再试一次或换文字粘贴</div>'
      +'<button class="btn ghost" onclick="renderNewRcp()">返回手填</button>');
    return;
  }
  const items=(obj.items||[]).map(function(x){
    const nm=String(x.name||x.n||"").trim();
    const g=Math.round(+(x.g||x.gram||0))||100;
    const mt=matchFood(nm);
    return {raw:nm,n:mt?mt.n:null,how:mt?mt.how:null,g:g,guess:!!x.guess};
  }).filter(function(x){return x.raw});
  if(!items.length){
    openSheet('<h3>没识别出食材</h3><div class="tip">这张图里没找到可用的食材清单，换一张更清晰的，或直接粘贴文字</div>'
      +'<button class="btn ghost" onclick="renderNewRcp()">返回手填</button>');
    return;
  }
  if(obj.name)newRcp.n=String(obj.name).trim();
  newRcp.items=items;
  newRcp.steps=(obj.steps||[]).map(function(x){return String(x)}).join("\n");
  aiSug={};
  const miss=items.filter(function(x){return !x.n}).map(function(x){return x.raw});
  renderNewRcp();
  if(miss.length)askSuggest(miss);
}
function askSuggest(names){
  if(!S.ai||!S.ai.key)return;
  aiSugBusy=true;renderNewRcp();
  const pool=F.filter(function(f){return !f.my}).map(function(f){return f.n}).join("、");
  const user="下面这些词在本地食材库里找不到。请从给定列表里为每个词挑选最接近的 1–3 个候选，按接近程度排序。\n\n"
    +"待匹配："+names.join("、")+"\n\n可选列表："+pool+"\n\n"
    +"要求：只输出 JSON；确实没有相近的就给空数组，不要硬凑。\n"
    +'格式：{"items":[{"raw":"鸡里脊","c":["鸡胸肉","鸡腿肉"],"why":"同一部位，脂肪接近"}]}';
  const payload={model:(S.ai.model||"deepseek-flash"),temperature:0.2,max_tokens:700,
    messages:[{role:"user",content:user}],response_format:{type:"json_object"}};
  aiPost(payload,function(t){
    aiSugBusy=false;
    try{
      const o=aiContentOf(t);
      (o.items||[]).forEach(function(x){
        const raw=String(x.raw||"").trim();

        if(raw&&cs.length)aiSug[raw]={c:cs,why:String(x.why||"")};

    }catch(e){}
    renderNewRcp();
  });
}

function saveNewFood(){
  const g=function(id){const e=document.getElementById(id);return e?e.value:""};
  const name=String(g("nf_name")).trim();
  const kcal=parseFloat(g("nf_k"));
  if(!name){alert("先填名称");return}
  if(!(kcal>0)){alert("热量必填，而且要大于 0");return}
  if(BY[name]&&!BY[name].my){alert("库里已经有「"+name+"」了，直接用就行，不用新建");return}
  const catEl=document.getElementById("nf_cat");
  const cat=(catEl&&catEl.value)||"protein";
  const rec={n:name,cat:cat,kcal:kcal,p:+g("nf_p")||0,f:+g("nf_f")||0,c:+g("nf_c")||0,
    fib:+g("nf_fib")||0,na:+g("nf_na")||0,
    un:String(g("nf_un")||"份").trim()||"份",ug:+g("nf_ug")||100,
    src:nfAI?"AI 估算（未核对）":"自建食材（非成分表）",
    note:nfAI?"AI 按常见做法估的典型值，不是实测":"自建，数值未核对"};
  S.myFood=S.myFood||[];
  const idx=S.myFood.findIndex(function(x){return x.n===name});
  if(idx>-1){
    /* 同名覆盖＝编辑原食材，沿用原 id，库存/浪费里的引用才不会断 */
    const old=S.myFood[idx];
    if(+old.id>=1000)rec.id=old.id;
    S.myFood.splice(idx,1);
  }
  if(!(+rec.id>=1000)){
    const used={};
    S.myFood.forEach(function(x){if(+x.id>=1000)used[+x.id]=1});
    let nid=Math.max(1000,+(S.nextFoodId||1000));
    while(used[nid])nid++;
    rec.id=nid;S.nextFoodId=nid+1;
  }
  S.myFood.push(rec);
  rebuildFoods();save();
  const inRcp=typeof newRcp!=="undefined"&&newRcp&&newRcp.items&&newRcp.items.length;
  if(inRcp&&tab!=="food"){
    const target=newRcp.items.filter(function(x){return !x.n&&x.raw===name})[0]
              ||newRcp.items.filter(function(x){return !x.n})[0];
    if(target){target.n=name;target.how="新建"}
    sheetRedraw=1;renderNewRcp();
  }else{
    closeSheet();setTab("food");foodQ=name;render();
  }
  notice("已新建「"+name+"」，食材页和食谱里都能直接用");
}

  const items=newRcp.items;

function saveNewRcp(){
  const name=String(newRcp.n||"").trim();
  if(!name){alert("先给菜起个名字");return}
  if(!newRcp.items.length){alert("至少加一样食材，否则算不出营养");return}
  const bad=newRcp.items.filter(function(x){return !x.n});
  if(bad.length){
    alert("还有 "+bad.length+" 项没指定食材："+bad.map(function(x){return x.raw}).join("、")
      +"\n\n先给它们指定库里的食材，或者删掉，否则算不出营养。");
    return;
  }
  const steps=String(newRcp.steps||"").split(/\n/).map(function(x){return x.trim()}).filter(Boolean);
  const rec={n:name,i:newRcp.items.map(function(x){return [x.n,x.g]}),note:"自建菜谱",use:0};
  if(steps.length)rec.s=steps;
  S.myDish=S.myDish||[];
  const editing=(typeof newRcp.idx==="number"&&newRcp.idx>-1&&S.myDish[newRcp.idx]);
  if(editing){
    rec.use=S.myDish[newRcp.idx].use||0;
    rec.note=S.myDish[newRcp.idx].note||"自建菜谱";
    const same=S.myDish.filter(function(x,k){return k!==newRcp.idx&&x.n===name});
    if(same.length&&!confirm("已经有一个叫「"+name+"」的了，保存后会用新的替换它。继续吗？"))return;
    S.myDish=S.myDish.filter(function(x,k){return k!==newRcp.idx&&x.n!==name});
    S.myDish.push(rec);
  }else{
    const idx=S.myDish.findIndex(function(x){return x.n===name});
    if(idx>-1){
      if(!confirm("「"+name+"」已经存在，覆盖原来的配方吗？"))return;
      rec.use=S.myDish[idx].use||0;
      S.myDish.splice(idx,1);
    }
    S.myDish.push(rec);
  }
  save();closeSheet();
  q="";setTab("rcp");
  const m=dishMacro(rec,1);
  alert((editing?"已更新「":"已保存「")+name+"」：约 "+m.kcal+" kcal，蛋白 "+m.p+"g。");
}

/* ===== 记录频率：近 30 天这道菜吃过几次 =====
   日志名形如「食堂 · 番茄炒蛋盖饭 ×1.5」，先剥掉前缀和份数再比；
   名字只是开头相同（如「地锅鸡 + 米饭」）算半次，避免把一个套餐拆成两次。 */
function logNameKey(s){
  return String(s||"").replace(/^(食堂|自建|外食)\s*·\s*/,"").replace(/\s*×\s*[0-9.]+$/,"").trim();
}
function eatFreq(days){
  const map={};
  (S.logs||[]).forEach(function(l){
    if(daysAgo(l.d)>days)return;
    const k=logNameKey(l.name);
    if(k)map[k]=(map[k]||0)+1;
  });
  return map;
}
function freqHit(map,name){
  let n=0;
  for(const k in map){
    if(k===name)n+=map[k];
    else if(k.indexOf(name)===0)n+=map[k]*0.5;
  }
  return Math.round(n*10)/10;
}
/* 三套食谱合成一个候选池：自建/拆解菜品、AI 写的食谱、系统食谱 */
function rcpEntries(){
  const out=[];
  (S.myDish||[]).forEach(function(d,i){
    out.push({k:"dish",i:i,n:d.n,mac:dishMacro(d,1),steps:(d.s||[]).length,c:"",
      tag:(String(d.note||"").indexOf("外食")>-1?"外食估算"
        :String(d.note||"").indexOf("AI")>-1?"AI 拆解":"自建"),use:d.use||0,t:20,
      ing:(d.i||[]).map(function(x){return x[0]})});
  });
  (S.myRcp||[]).forEach(function(r,i){
    out.push({k:"rcp",i:i,n:r.n,mac:rcpMacro(r),steps:(r.s||[]).length,c:r.c||"",
      tag:"AI 食谱",use:r.use||0,t:r.t||20,r:r,ing:(r.m||[])});
  });
  RCP.forEach(function(r,i){
    out.push({k:"sys",i:i,n:r.n,mac:rcpMacro(r),steps:(r.s||[]).length,c:r.c,
      tag:"",use:0,t:r.t,r:r,ing:(r.m||[])});
  });
  return out;
}

/* 合并后的候选池：按范围/分类/关键词过滤，再按近 30 天吃过的次数排 */
function rcpSortedList(){
  const kw=q.trim(), fmap=eatFreq(30);
  const list=rcpEntries().filter(function(x){
    if(rcpSrc==="mine"&&x.k==="sys")return false;
    if(rcpSrc==="sys"&&x.k!=="sys")return false;
    /* 自定义菜谱没有早/主/汤/免分类，选了分类就不掺进来 */
    if(rcpFilter!=="all"&&x.c!==rcpFilter)return false;
    if(!kw)return true;
    if(x.n.indexOf(kw)>-1)return true;
    if(x.ing&&x.ing.some(function(n){return n.indexOf(kw)>-1}))return true;
    return x.k==="sys"&&rcpMatch(x.r,kw);
  });
  list.forEach(function(x){x.f=freqHit(fmap,x.n)});
  list.sort(function(a,b){
    return (b.f-a.f)||(b.use-a.use)||a.n.localeCompare(b.n,"zh");
  });
  return list;
}

      <div class="mac">${m.kcal} kcal · 蛋白 ${m.p}g · 碳水 ${m.c}g · 脂肪 ${m.f}g</div>
      ${x.k==="sys"?`<div class="badges">${(x.ing||[]).slice(0,4).map(n=>`<span class="badge info">${n}</span>`).join("")}</div>`:""}

  else{

      const f=foodOf(it),r=remDays(it);
      if(!f)return;
      const bd=r<0?["已过期","badge warn"]:r<=0?["今天要用","badge warn"]:r<=3?[r+"天","badge info"]:[r+"天","badge mut"];
      h+=`<div class="food" onclick="openBatch('${it.d}',${it.id})">
        <div class="info"><div class="nm">${f.n}<span class="${bd[1]}">${bd[0]}</span></div>
        <div class="mt">净 ${Math.round(it.g)}g${f.e<100?"（毛 "+Math.round(it.g/(f.e/100))+"g）":""} · ${Math.round(f.kcal*it.g/100)} kcal · 蛋白 ${(f.p*it.g/100).toFixed(1)}g · 买于 ${it.d.slice(5)}</div></div></div>`;
    });
  }
  h+=`</div>`;
  return h;
}

function weekStats(days,last7){
  const logged=last7.filter(function(d){return days[d]});
  const n=logged.length;
  const sum=logged.reduce(function(a,d){return a+days[d].kcal},0);
  const avg=n?Math.round(sum/n):0;
  const hit=last7.filter(function(d){return days[d]&&days[d].p>=S.set.protein*0.85}).length;
  const w7=(S.waste||[]).filter(function(w){return daysAgo(w.d)<=6});
  const wg=w7.reduce(function(a,w){return a+(w.g||0)},0);
  const wk=w7.reduce(function(a,w){const f=foodOf(w);return a+(f?f.kcal*w.g/100:0)},0);
  return {n:n,avg:avg,hit:hit,w7:w7,wg:wg,wk:wk,exp:expireList()};
}
function weekBrief(days,last7){
  const st=weekStats(days,last7), sg=S.set;
  const adv=[];
  if(st.n<4){
    adv.push("这周只记了 "+st.n+" 天，还看不出趋势。先把记录稳定下来，哪怕每天只记一顿。");
  }else{
    if(st.avg>sg.kcal+200) adv.push("日均 "+st.avg+" kcal，比目标高 "+(st.avg-sg.kcal)+"，先查主食份量和食堂的油。");
    else if(st.avg<sg.kcal-300) adv.push("日均 "+st.avg+" kcal，比目标低 "+(sg.kcal-st.avg)+"，掉太快容易掉肌肉，主食加回来一点。");
    if(st.hit<4) adv.push("蛋白达标 "+st.hit+"/"+st.n+" 天，不到一半。每天固定一份蛋白比临时补更管用。");
  }
  if(st.w7.length>=2) adv.push("这周扔了 "+st.w7.length+" 次（"+Math.round(st.wg)+"g，折合 "+Math.round(st.wk)+" kcal）。看看是哪几样总放过期，直接从采购清单里删掉。");
  if(st.exp.length) adv.push("现在有 "+st.exp.length+" 样快过期，今明两天优先用掉。");
  if(!adv.length) adv.push("这周记录稳定、蛋白达标、没有浪费，保持就行。");
  return '<div class="card"><h2>本周简报<span>记录了 '+st.n+'/7 天</span></h2>'
    +'<div style="font-size:13px;line-height:1.85;color:var(--ink2)">'
    +'<div>日均 <b style="color:var(--ink)">'+st.avg+'</b> kcal（目标 '+sg.kcal+'）　·　蛋白达标 <b style="color:var(--ink)">'+st.hit+'</b> 天</div>'
    +'<div>浪费 '+st.w7.length+' 次 · '+Math.round(st.wg)+'g　·　库存临期 '+st.exp.length+' 样</div>'
    +'<div style="margin-top:9px;padding:10px 12px;background:var(--gl);border-radius:9px;color:var(--ok-ink)">'
    +adv.map(function(x){return '<div>· '+x+'</div>'}).join("")+'</div>'
    +'</div>'
    +'<div style="height:10px"></div><button class="btn ghost" onclick="openWeekReport()">看明细</button>'
    +'</div>';
}

/* ===== 外观：跟随系统 / 浅色 / 深色 ===== */
const THEME_LABEL={auto:"跟随系统",light:"浅色",dark:"深色"};
function themeMode(){return (S.set&&S.set.theme)||"auto"}
function applyTheme(){
  const m=themeMode();
  const sysDark=!!(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches);
  const dark=m==="dark"||(m==="auto"&&sysDark);
  const el=document.documentElement;
  el.setAttribute("data-theme",dark?"dark":"light");
  try{el.style.colorScheme=dark?"dark":"light"}catch(e){}
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute("content",dark?"#141517":"#FBFAF7");
  /* App 里顺手把系统导航栏和 WebView 底色一起换掉，不然深色下底部会留一条白 */
  if(window.AndroidBridge&&window.AndroidBridge.syncBars){
    try{window.AndroidBridge.syncBars(dark?"#141517":"#FBFAF7",dark)}catch(e){}
  }
}
function setTheme(m){
  S.set.theme=(m==="light"||m==="dark")?m:"auto";
  save();applyTheme();render();
}

let sheetTimer=null,sheetPrevFocus=null;
/* ===== 滚动锁：弹层/整页打开时，背后的页面不跟着动 ===== */
let scrollLock=0;
function lockScroll(d){
  scrollLock=Math.max(0,scrollLock+d);
  document.body.style.overflow=scrollLock?"hidden":"";
}

/* ===== 弹层：每一层压栈，手势/返回键只退一层 ===== */
let sheetStack=[],sheetCur="",sheetRedraw=false,sheetHoldLock=false,sheetPushNext=false;

function openSheet(html,opt){
  opt=opt||{};
  const sh=$("sheet"),box=$("sheetBox");
  if(sheetTimer){clearTimeout(sheetTimer);sheetTimer=null}
  const wasOn=sh.classList.contains("on");
  sh.classList.remove("closing");
  /* 已经开着弹层时再开一个＝进一层；renderXxx 这类重绘会先置 sheetRedraw，不压栈 */
  if(wasOn&&!opt.replace&&(opt.push||sheetPushNext||!sheetRedraw)&&sheetCur)sheetStack.push(sheetCur);
  sheetRedraw=false;sheetPushNext=false;
  box.setAttribute("tabindex","-1");
  if(!wasOn){
    sheetPrevFocus=document.activeElement;
    sheetStack=[];
    box.style.animation="none";
    if(!sheetHoldLock){sheetHoldLock=true;lockScroll(1)}
  }
  box.innerHTML='<button class="x" onclick="closeSheet()" aria-label="关闭">×</button>'
    +'<div class="sheetIn">'+html+'</div>';
  sheetCur=html;
  box.scrollTop=0;
  if(!wasOn){
    void box.offsetWidth;
    box.style.animation="sheetUp .42s cubic-bezier(.22,1,.36,1) both";
  }else{
    /* 换层：面板本身不动，只让内容按方向轻移 20px（进＝从右，退＝从左） */
    box.style.animation="none";
    const inner=box.querySelector(".sheetIn");
    if(inner){
      inner.classList.remove("inR","inL");
      void inner.offsetWidth;
      inner.classList.add(opt.back?"inL":"inR");
    }
  }
  sh.classList.add("on");
  a11yPatch(box);
  if(!wasOn)setTimeout(function(){try{box.focus({preventScroll:true})}catch(e){}},30);
}
/* 退一层；已经在第一层就整层关闭 */
function sheetBack(){
  const sh=$("sheet");
  if(!sh||!sh.classList.contains("on"))return false;
  if(!sheetStack.length){closeSheet();return true}
  const prev=sheetStack.pop();
  openSheet(prev,{replace:1,back:1});
  return true;
}
function closeSheet(instant){
  const sh=$("sheet");
  if(!sh)return;
  if(sheetTimer){clearTimeout(sheetTimer);sheetTimer=null}
  const box=$("sheetBox");
  sheetStack=[];sheetCur="";
  if(box){box.style.animation="";box.style.transform="";box.style.transition=""}
  const unlock=function(){
    if(sheetHoldLock){sheetHoldLock=false;lockScroll(-1)}
    if(sheetPrevFocus&&sheetPrevFocus.isConnected){try{sheetPrevFocus.focus({preventScroll:true})}catch(e){}}
    sheetPrevFocus=null;
  };
  if(instant||!sh.classList.contains("on")){
    sh.classList.remove("on","closing");
    unlock();
    return;
  }
  sh.classList.add("closing");
  sheetTimer=setTimeout(function(){
    sh.classList.remove("on","closing");
    sheetTimer=null;
    unlock();
  },310);
}

/* 打开动画放完就撤掉 fill:both，否则它会一直压住行内 transform，下拉拖动时面板不跟手 */
$("sheetBox").addEventListener("animationend",function(e){
  if(e.target!==this)return;
  /* 一定落到 "none"：若清成空串，CSS 里的 .sheet.on .box 会重新接管并重播上滑 */
  if(e.animationName==="sheetUp"||e.animationName==="sheetStep")this.style.animation="none";
});

let curRcp=-1;

/* ===================== 记这一餐（统一入口） =====================
   自建菜谱与内置食谱走同一个页面：可选「吃库存 / 吃食堂」，
   可增减每个食材的克数、去掉没放的、临时加别的食材。
   所有调整只作用于这一次记录，不改食谱本身。 */
let mlCtx=null;

function mlBuild(kind,idx,src){
  let title="",items=[];
  if(kind==="rcp"){
    const r=ALL()[idx];if(!r)return null;
    title=r.n;
    (r.m||[]).forEach(function(n){const f=BY[n];if(f)items.push({n:n,base:f.ug,g:f.ug,on:true,opt:false})});
    (r.o||[]).forEach(function(n){const f=BY[n];if(f)items.push({n:n,base:f.ug,g:f.ug,on:false,opt:true})});
  }else{
    const d=(S.myDish||[])[idx];if(!d)return null;
    title=d.n;
    (d.i||[]).forEach(function(x){
      const f=BY[x[0]];
      items.push({n:x[0],base:x[1],g:x[1],on:true,opt:false});
    });
  }
  return {kind:kind,idx:idx,title:title,items:items,mult:1,src:src||"stock"};
}
function openMealLog(kind,idx,src){
  mlCtx=mlBuild(kind,idx,src);
  if(!mlCtx){alert("找不到这道菜");return}
  mlApplySrc();sheetPushNext=1;renderMealLog();
}
function mlApplySrc(){
  const c=mlCtx;
  c.items.forEach(function(it){
    const f=BY[it.n],own=f?invQty(f.n):0;
    it.g=(c.src==="stock"&&own>0)?Math.min(it.base,Math.max(1,Math.round(own))):it.base;
    if(it.opt)it.on=false;
  });
}
function mlMacros(){
  const c=mlCtx;let k=0,p=0,f=0,cb=0,na=0,veg=0,n=0,fib=0,ca=0,fe=0,vc=0;
  c.items.forEach(function(it){
    if(!it.on||!(it.g>0))return;
    const fd=BY[it.n];if(!fd)return;      /* 注意：别用 f，会遮住上面累加脂肪的 f */
    const r=it.g/100;
    k+=fd.kcal*r;p+=fd.p*r;f+=fd.f*r;cb+=fd.c*r;
    na+=(fd.na||0)*r;fib+=(fd.fib||0)*r;ca+=(fd.ca||0)*r;fe+=(fd.fe||0)*r;vc+=(fd.vc||0)*r;
    if(fd.cat==="veg")veg+=it.g;n++;
  });
  return {kcal:k,p:p,f:f,c:cb,na:na,veg:veg,n:n,
    fib:Math.round(fib*10)/10,ca:Math.round(ca),fe:Math.round(fe*10)/10,vc:Math.round(vc*10)/10};
}
function mlPreview(){
  if(!mlCtx)return;
  const m=mlMacros(),pv=$("mlpv");if(!pv)return;
  pv.innerHTML='<div class="l"><b>这一餐</b><b>'+Math.round(m.kcal)+' kcal</b></div>'
    +'<div class="l"><span>蛋白 '+m.p.toFixed(1)+'g ｜ 碳水 '+m.c.toFixed(1)+'g ｜ 脂肪 '+m.f.toFixed(1)+'g</span><span></span></div>'
    +'<div class="l"><span style="color:var(--ink3)">钠 '+Math.round(m.na)+'mg'+(m.na>800?'　⚠ 偏高':'')+'</span></div>';
  pv.dataset.k=m.kcal;pv.dataset.p=m.p;pv.dataset.f=m.f;pv.dataset.c=m.c;pv.dataset.na=m.na;pv.dataset.veg=m.veg;
}
function renderMealLog(){
  sheetRedraw=1;
  const c=mlCtx;if(!c)return;
  let h='<h3>'+esc(c.title)+'</h3><div class="sm">'+(c.kind==="rcp"?"食谱":"自建菜谱")
    +' ｜ 这里的改动只算这一餐，不改食谱本身</div>';
  h+='<div class="chips" style="margin:4px 0 2px">'
    +[["stock","吃库存（扣库存）"],["canteen","吃食堂（不扣库存）"]].map(function(x){
      return '<span class="chip '+(c.src===x[0]?"on":"")+'" onclick="setMealSrc(\''+x[0]+'\')">'+x[1]+'</span>';
    }).join("")+'</div>';
  h+='<div class="chips" style="margin:2px 0 6px">'
    +[0.5,1,1.5,2].map(function(v){
      return '<span class="chip '+(c.mult===v?"on":"")+'" onclick="setMealMult('+v+')">'+v+' 份</span>';
    }).join("")
    +'<span class="chip" onclick="openMealAdd()">＋ 加食材</span></div>';
  h+='<div class="sec"><b>实际放了什么</b><span>点名字＝这份不放</span></div>';
  c.items.forEach(function(it,i){
    const f=BY[it.n];
    const kcal=f?Math.round(f.kcal*it.g/100):0;
    const prot=f?(f.p*it.g/100).toFixed(1):"0";
    const own=f?invQty(f.n):0;
    const lack=(c.src==="stock"&&it.on&&f&&own<=0)?'<span class="badge warn" style="margin-left:4px">缺</span>':"";
    const opt=it.opt?'<span class="badge mut" style="margin-left:4px">可选</span>':"";
    h+='<div class="opt'+(it.on?" on":"")+'" style="'+(it.on?"":"opacity:.5")+'">'
      +'<span class="on1" onclick="toggleMealItem('+i+')">'+esc(it.n)+opt+lack
      +'<br><span style="font-size:11.5px;color:var(--ink3)">'+(f?kcal+' kcal · 蛋白 '+prot+'g':'库里没有这个食材')+'</span></span>'
      +'<input type="number" value="'+Math.round(it.g)+'" inputmode="decimal" '+(it.on?"":"disabled")
      +' onchange="setMealG('+i+',this.value)"></div>';
  });
  h+='<div class="preview" id="mlpv"></div>';
  h+='<div class="sm" style="margin-bottom:0">记到哪一餐</div>'+mealChips();
  h+='<button class="btn" onclick="saveMealLog()">记下这一餐</button>';
  h+='<div style="height:8px"></div><button class="btn ghost" onclick="backToRcp()">返回食谱详情</button>';
  openSheet(h);
  mlPreview();
}
function setMealSrc(k){
  mlCtx.src=k;mlApplySrc();renderMealLog();
}
function setMealMult(v){
  mlCtx.mult=v;
  mlCtx.items.forEach(function(it){it.g=Math.max(1,Math.round(it.base*v))});
  renderMealLog();
}
function toggleMealItem(i){
  const it=mlCtx.items[i];if(!it)return;
  it.on=!it.on;renderMealLog();
}
function setMealG(i,v){
  const it=mlCtx.items[i],g=parseFloat(v);
  if(!it||!(g>0))return;
  it.g=g;mlPreview();
}
function saveMealLog(){
  if(!mlCtx)return;
  const c=mlCtx,m=mlMacros();
  if(!m.n){alert("至少留一样食材");return}
  if(c.src==="stock"){
    c.items.forEach(function(it){
      if(!it.on||!(it.g>0))return;
      const f=BY[it.n];if(!f)return;
      let need=it.g;
      S.inv.filter(function(x){return foodName(x)===f.n}).sort(function(a,b){return a.d.localeCompare(b.d)}).forEach(function(b){
        if(need<=0)return;
        const use=Math.min(need,b.g);b.g-=use;need-=use;
      });
    });
    S.inv=S.inv.filter(function(x){return x.g>0.5});
  }
  const nm=(c.src==="canteen"?"食堂 · ":"")+c.title+(c.mult!==1?" ×"+c.mult:"");
  S.logs.push({d:logDate(),m:logMeal,name:nm,kcal:Math.round(m.kcal),
    p:+m.p.toFixed(1),f:+m.f.toFixed(1),c:+m.c.toFixed(1),na:Math.round(m.na),veg:Math.round(m.veg),
    fib:m.fib,ca:m.ca,fe:m.fe,vc:m.vc});
  logDone("today",nm+" · "+Math.round(m.kcal)+" kcal");
}
function backToRcp(){
  const c=mlCtx;if(!c)return;
  if(sheetStack.length){sheetBack();return}          /* 有上一层就退回去，不重新铺一遍 */
  if(c.kind==="rcp")openRcp(c.idx);else openMyRcp(c.idx);

/* ===================== 整页覆盖层 ===================== */
let pagePrevFocus=null,pageHoldLock=false;
var MEMO_TTL=5*60e3;                      /* 5 分钟内回到原位置，超过就从头开始 */
var pageMemo={};
function memoSet(k,y){if(k)pageMemo[k]={y:y,at:Date.now()}}
function memoGet(k){const m=k&&pageMemo[k];return (m&&Date.now()-m.at<MEMO_TTL)?m.y:0}
function pageKey(){
  if(typeof pageMode==="undefined"||!pageMode)return "page";
  return "page:"+pageMode;
}
/* 标签页的滚动记忆 */
var memoTab={
  set:function(k,y){pageMemo["tab:"+k]={y:y,at:Date.now()}},
  get:function(k){return memoGet("tab:"+k)}
};
let pageTimer=null,pageStack=[];
function openPage(html,opt){
  opt=opt||{};
  const p=$("page"),i=$("pageIn");if(!p||!i)return;
  const wasOpen=p.classList.contains("on")||p.classList.contains("closing");  /* 正在收起也算"开着"，避免重复加锁 */
  const newMode=opt.mode||pageMode||"";
  const sameMode=wasOpen&&newMode===(pageMode||"");
  if(pageTimer){clearTimeout(pageTimer);pageTimer=null}
  if(!wasOpen){
    pagePrevFocus=document.activeElement;
    pageStack=[];                                   /* 全新打开：祖先进程清空 */
  }else if(!sameMode&&!opt.replace){
    /* 同一个覆盖层里换了一种页面（趋势→当天）：把当前这层压栈，返回时原路退回 */
    pageStack.push({html:i.innerHTML,mode:pageMode||"",scroll:p.scrollTop});
  }
  pageMode=newMode;
  /* 已经打开时重绘（点柱子、切范围）保持当前位置；首次打开才取记忆 */
  const keep=opt.top?0:(wasOpen?p.scrollTop:memoGet(opt.key||pageKey()));
  p.classList.remove("closing","backstep");
  i.style.transition="";i.style.transform="";        /* 清掉拖拽留下的内联位移 */
  i.classList.remove("slideL","slideR","pushIn","slideout");
  i.innerHTML=html;
  p.classList.add("on");
  if(!pageHoldLock){pageHoldLock=true;lockScroll(1)}
  p.scrollTop=keep;
  a11yPatch(i);
  void i.offsetWidth;
  if(opt.slide){
    const cls=opt.slide>0?"slideL":"slideR";
    i.classList.add(cls);
    setTimeout(function(){i.classList.remove(cls)},260);   /* 动画带 fill:both，不摘掉会压住后续拖拽 */
  }else if(wasOpen&&!sameMode){
    i.classList.add("pushIn");
    setTimeout(function(){i.classList.remove("pushIn")},280);
  }
}
function closePage(){
  const p=$("page"),i=$("pageIn");if(!p||!i||!p.classList.contains("on"))return;
  memoSet(pageKey(),p.scrollTop);
  if(pageTimer){clearTimeout(pageTimer);pageTimer=null}

  /* 还有上一层：当前内容向右滑出，再把上一层接回来（原路逐级退出） */
  if(pageStack.length){
    const prev=pageStack.pop();
    i.classList.remove("slideL","slideR","slideout");
    void i.offsetWidth;
    i.classList.add("slideout");
    pageTimer=setTimeout(function(){
      pageTimer=null;
      i.classList.remove("slideout");
      pageMode=prev.mode||"";
      i.innerHTML=prev.html;
      p.scrollTop=prev.scroll;
      p.classList.add("backstep");
      setTimeout(function(){p.classList.remove("backstep")},200);
      a11yPatch(i);
    },190);
    return;
  }

  /* 最后一层：整页滑出后真正关闭 */
  const finish=function(){
    if(pageTimer){clearTimeout(pageTimer);pageTimer=null}
    p.removeEventListener("animationend",onEnd);
    p.classList.remove("on","closing","backstep");    /* 一次移除，避免 pageIn 重播 */
    if(pageHoldLock){pageHoldLock=false;lockScroll(-1)}
    if(pagePrevFocus&&pagePrevFocus.isConnected){try{pagePrevFocus.focus({preventScroll:true})}catch(e){}}
    pagePrevFocus=null;
    pageMode="";
    logDay="";                                        /* 离开记录页就别再留着补记目标 */
  };
  const onEnd=function(e){if(e.target===p&&e.animationName==="pageOut")finish()};
  p.addEventListener("animationend",onEnd);
  p.classList.add("closing");
  pageTimer=setTimeout(finish,300);                   /* 动画事件缺失时兜底 */
}

let trKey="7", trCust={from:"",to:""}, trSel=-1, trData=[], trWin=["",""], pageMode="";
function trendWindow(){
  const to=today();
  if(trKey==="custom"){
    const f=trCust.from||dayAdd(to,-6), t=trCust.to||to;
    return (new Date(f+"T00:00:00")<=new Date(t+"T00:00:00"))?[f,t]:[t,f];
  }
  const n=+trKey||7;
  return [dayAdd(to,-(n-1)),to];
}
function trendBuckets(from,to){
  const list=[];
  for(let d=from;d<=to;d=dayAdd(d,1))list.push(d);
  const days=list.length||1;
  const step=days>35?7:1;
  const out=[];
  for(let i=0;i<list.length;i+=step){
    const chunk=list.slice(i,i+step);
    const b={from:chunk[0],to:chunk[chunk.length-1],kcal:0,p:0,c:0,f:0,n:0,days:chunk.length};
    chunk.forEach(function(d){
      const s=daySum(d);
      if(s.t.n){b.kcal+=s.t.kcal;b.p+=s.t.p;b.c+=s.t.c;b.f+=s.t.f;b.n++;}
    });
    out.push(b);
  }
  return out;
}

/* 覆盖层手势：
   日视图左右拖＝三页轨道跟手滑动（邻居从两侧进来），松手够远就翻页；
   屏幕边缘起手＝交给系统返回 / 退出这一页；滑到底再上滑＝日历 */
(function(){
  const pg=document.getElementById("page");
  if(!pg)return;
  let sx=0,sy=0,t0=0,axis="",active=false,edge=false;

  pg.addEventListener("touchstart",function(e){
    if(e.touches.length!==1)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;t0=Date.now();
    axis="";active=false;edge=(sx<26||sx>window.innerWidth-26);
  },{passive:true});

  pg.addEventListener("touchmove",function(e){
    if(e.touches.length!==1||pageMode!=="day")return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(!axis){
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.25)axis="x";
      else if(Math.abs(dy)>10)axis="y";
    }
    if(axis!=="x"||edge)return;
    const track=$("dayTrack");
    if(!track)return;
    if(!active){active=true;track.style.transition="none";fitPager("max")}
    const lim=window.innerWidth*0.45;
    let tx=dx;
    if(Math.abs(tx)>lim)tx=(tx<0?-1:1)*(lim+(Math.abs(tx)-lim)*0.35);   /* 越界橡皮筋 */
    track.style.transform="translateX(calc(-33.3333% + "+tx+"px))";     /* 三页一起跟手 */
    if(e.cancelable)e.preventDefault();
  },{passive:false});

  function settle(){
    const track=$("dayTrack");if(!track)return;
    track.style.transition="transform .26s cubic-bezier(.22,1,.36,1)";
    track.style.transform="translateX(-33.3333%)";
    setTimeout(fitPager,270);            /* 回弹后再收回到当前页高度 */
  }
  function pageTo(dir){
    const track=$("dayTrack");
    if(!track){dayCur=dayAdd(dayCur,dir);renderDayView();return}
    track.style.transition="transform .24s cubic-bezier(.22,1,.36,1)";
    track.style.transform="translateX("+(dir>0?-66.6667:0)+"%)";
    setTimeout(function(){
      dayCur=dayAdd(dayCur,dir);
      renderDayView();                       /* 重建三页，落回中间 */
    },250);
  }

  pg.addEventListener("touchend",function(e){
    const t=(e.changedTouches&&e.changedTouches[0])||{clientX:sx,clientY:sy};
    const dx=t.clientX-sx,dy=t.clientY-sy,dt=Math.max(1,Date.now()-t0),vx=dx/dt;
    if(active){
      active=false;axis="";
      const w=window.innerWidth;
      /* 翻页判定：拖过屏宽 22%，或"够快且超过 40px"的甩动；否则回弹 */
      const far=Math.abs(dx)>w*0.22;
      const flick=Math.abs(vx)>0.55&&Math.abs(dx)>40&&dt<=400;
      if(far||flick)pageTo(dx<0?1:-1);
      else settle();
      return;
    }
    /* 没进入拖拽：边缘退出、快速轻扫换天、底部上滑开日历 */
    if(edge&&dx>60&&Math.abs(dx)>Math.abs(dy)*1.4){closePage();return}
    if(pageMode!=="day")return;
    if(!edge&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){shiftDay(dx<0?1:-1);return}
    const atBottom=pg.scrollTop+pg.clientHeight>=pg.scrollHeight-30;
    if(dy<-70&&Math.abs(dy)>Math.abs(dx)*1.5&&atBottom)openCal();
  },{passive:true});

  pg.addEventListener("touchcancel",function(){
    if(active){active=false;axis="";settle()}
  },{passive:true});
})();

/* 轨道高度：静止时对齐「当天」这一页；拖动时按三页里最高的一页，
   避免"短页翻到长页"时长页被裁掉半截 */
function fitPager(mode){
  const track=$("dayTrack");
  if(!track)return;
  const pager=track.parentNode,ps=track.children;
  let h=0;
  if(mode==="max"){
    for(let i=0;i<ps.length;i++)h=Math.max(h,ps[i].offsetHeight);
  }else if(ps[1]){
    h=ps[1].offsetHeight;
  }
  pager.style.height=h+"px";
  if(mode!=="max"){
    track.style.transition="none";
    track.style.transform="translateX(-33.3333%)";
    void track.offsetWidth;
  }
}

function normName(s){
  return String(s==null?"":s)
    .replace(/[（(][^）)]*[）)]/g,"")
    .replace(/[【\[][^】\]]*[】\]]/g,"")
    .replace(/^(新鲜|鲜|生|熟|干)/,"")
    .trim();
}
function matchFood(raw){
  const n=String(raw==null?"":raw).trim();
  if(!n)return null;
  if(BY[n])return {n:BY[n].n,how:"同名"};
  const base=normName(n);
  let al=OIL_ALIAS[n]||NAME_EXTRA[n]||ALIAS[n];
  if(al&&BY[al])return {n:al,how:"同义词"};
  if(base&&BY[base])return {n:BY[base].n,how:"去括号"};
  al=OIL_ALIAS[base]||NAME_EXTRA[base]||ALIAS[base];
  if(al&&BY[al])return {n:al,how:"同义词"};
  if(base.length>=2){
    let best=null;
    for(const k in BY){
      if(k.length<2)continue;
      if(n.indexOf(k)>-1||k.indexOf(base)>-1){
        if(!best||k.length>best.length)best=k;
      }
    }
    if(best)return {n:best,how:"近似"};
  }
  return null;
}

  if(!el)return;
  let h='<div class="l"><b>已计入合计</b><b>'+m.kcal+' kcal</b></div>'
    +'<div class="l"><span>约 '+m.g+'g</span></div>'

    +'<div class="l"><span>钠 '+m.na+'mg'+(m.na>800?'　⚠ 偏高':'')+'</span></div>';
  if(un.length)h+='<div class="l"><span style="color:var(--r)">未计入 '+un.length+' 项，共 '+Math.round(unG)+'g</span></div>';
  // 合理性校验：抓自相矛盾的结果
  const warn=[];
  if(m.g>=120&&m.kcal<120)warn.push("总重 "+m.g+"g 却只有 "+m.kcal+" kcal，多半有食材没计入");
  if(m.na>700&&m.kcal<250)warn.push("钠 "+m.na+"mg 但热量仅 "+m.kcal+" kcal，比例不对");
  const hasMeat=aiDishItems.some(function(x){return x.n&&BY[x.n].cat==="protein"&&x.g>=50});
  if(hasMeat&&m.p<8)warn.push("有蛋白类食材（≥50g）但蛋白只有 "+m.p+"g，检查是否漏项");
  let estOk="",estMid="";
  /* AI 核对：另一条独立估算，四项逐项对一遍 */
  if(aiEstLoading){
    h+='<div class="l"><span style="color:var(--ink3)"><span class="spinner" style="width:12px;height:12px;margin-right:5px"></span>正在让 AI 独立核对热量与营养素…</span></div>';
  }else if(aiEst&&aiEst.kcal>0){
    const k=aiEst.kcal;
    const dd=Math.round((m.kcal-k)/k*100), ad=Math.abs(dd);
    const rng=aiEst.hi?"（"+aiEst.lo+"–"+aiEst.hi+"）":"";
    h+='<div class="l" style="margin-top:4px"><b>AI 核对 <span onclick="askEstimate()" style="font-weight:400;font-size:11.5px;color:var(--g);margin-left:4px;cursor:pointer">重核</span></b>'
      +'<b>'+k+' kcal'+rng+'</b></div>'
      +'<div class="l"><span>本地 '+m.kcal+' kcal · 相差 '+ad+'%</span></div>';
    [["蛋白","p"],["碳水","c"],["脂肪","f"]].forEach(function(x){
      const a=aiEst[x[1]],b=Math.round(m[x[1]]);
      if(!(a>0))return;
      const d=Math.round((m[x[1]]-a)/a*100);
      const off=Math.abs(d)>35;
      h+='<div class="l"><span style="'+(off?'color:var(--a)':'')+'">'+x[0]+' 本地 '+b+'g / AI '+a+'g（'+(d>0?"+":"")+d+'%）'+(off?" ⚠":"")+'</span></div>';
    });
    if(aiEst.note)h+='<div class="l"><span style="color:var(--ink4);font-size:11px">AI 依据：'+esc(aiEst.note)+'</span></div>';
    if(ad>40){
      warn.push("AI 凭经验估 "+k+" kcal"+rng+"，本地算 "+m.kcal+" kcal，相差 "+ad+"%"
        +(dd<0?"。本地偏低，多半还有漏项":"。本地偏高，检查油和糖是否给多了"));
    }else if(ad>25){
      estMid="热量相差 "+ad+"%，在估算误差范围内，看上面逐项的差异";
    }else{
      estOk="热量相差 "+ad+"%，和 AI 的独立估算互相印证";
    }
  }
  if(warn.length)h+='<div class="l"><span style="color:var(--r);line-height:1.5">⚠ '+warn.join("<br>⚠ ")+'</span></div>';
  if(estOk)h+='<div class="l"><span style="color:var(--ok-ink);line-height:1.5">✓ '+estOk+'</span></div>';
  if(estMid)h+='<div class="l"><span style="color:var(--ink3);line-height:1.5">≈ '+estMid+'</span></div>';
  el.innerHTML=h;
}

function runAI(noFmt){

  if(!ing){alert("先写手上有什么");return}

  const sys="你是中式家常菜顾问。用户只有一台额定600W的电煮锅，只能水煮、蒸、焯、焖，没有炒锅、没有烤箱、没有冰箱。只输出 JSON。";
  const user="用户现有食材："+ing+"\n额外要求："+(q||"无")+"\n\n"
   +"要求：\n1. 只用上述食材，最多额外加一种常见调味\n2. 必须能用水煮/蒸/焯/焖完成，禁止炒、煎、炸、烤\n"

   +"5. steps 每条不超过 18 个字，desc 不超过 20 个字，tip 不超过 25 个字\n"
   +"6. 下面这些菜已经有了，不要再推荐，换个思路："+ALL().map(function(x){return x.n}).join("、")+"\n"
   +"7. 只输出 JSON 本身，一行都不要多写\n\n"
   +'格式：{"recipes":[{"name":"菜名","time":18,"desc":"一句话","must":["食材1"],"opt":[],"steps":["步骤1","步骤2","步骤3"],"tip":"提示"}]}';
  const payload={model:(S.ai.model||"deepseek-flash"),temperature:0.6,max_tokens:2600,
    messages:[{role:"system",content:sys},{role:"user",content:user}]};

function handleAI(t){
  if(!t)return '<div class="tip">没有返回内容</div>';
  if(t.indexOf("err:")===0){
    let msg=String(t).slice(4);
    const mm=msg.match(/"message"\s*:\s*"([^"]+)"/);
    if(mm)msg=mm[1];
    let hint="";
    if(msg.indexOf("model")>-1||msg.indexOf("Model")>-1)hint="点上面的「测试连接取列表」能看到这个 key 支持哪些模型。";
    else if(msg.indexOf("401")>-1||msg.indexOf("auth")>-1||msg.indexOf("Auth")>-1)hint="Key 不对或已作废，去后台重新建一个。";
    else if(msg.indexOf("402")>-1||msg.indexOf("balance")>-1)hint="账户余额不足。";
    else hint="如果是纯网络错误，检查手机是否联网；APK 版走原生请求，不受跨域限制。";
    return '<div class="tip">调用失败：'+msg+'<br><br>'+hint+'</div>';
  }
  let content="";
  try{
    const d=JSON.parse(t);
    content=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
  }catch(e){return '<div class="tip">接口返回的不是标准响应</div><details style="margin-top:8px"><summary style="font-size:12px;color:var(--ink3)">看原始返回</summary><div style="font-size:11px;color:var(--ink3);word-break:break-all;margin-top:6px">'+esc(t.slice(0,600))+'</div></details>'}
  if(!content.trim())return '<div class="tip">模型返回了空内容，再试一次</div>';
  let obj=null,err="";
  const cands=[];
  let c=content.trim();
  c=c.replace(/^\s*```(?:json)?/i,"").replace(/```\s*$/,"").trim();
  cands.push(c);
  const i=c.indexOf("{"),j=c.lastIndexOf("}");
  if(i>-1&&j>i)cands.push(c.slice(i,j+1));
  const i2=c.indexOf("{"),j2=c.indexOf("}");
  if(i2>-1&&j2>i2)cands.push(c.slice(i2,j2+1));
  for(const k of cands){
    const tries=[k,k.replace(/,\s*([}\]])/g,"$1")];
    for(const v of tries){
      try{obj=JSON.parse(v);break}catch(e){err=e.message}
    }
    if(obj)break;
  }
  if(!obj){
    return '<div class="tip">AI 返回的不是合法 JSON（可能是输出被截断）。再点一次通常就好了。<br><br><span style="color:var(--r)">'+esc(err)+'</span></div>'
      +'<details style="margin-top:8px"><summary style="font-size:12px;color:var(--ink3)">看原始返回（前 500 字）</summary><div style="font-size:11px;color:var(--ink3);word-break:break-all;margin-top:6px">'+esc(content.slice(0,500))+'</div></details>';
  }
  let arr=obj.recipes||obj.recipe||obj.list||obj.data;
  if(!Array.isArray(arr)){
    for(const k in obj){if(Array.isArray(obj[k])){arr=obj[k];break}}
  }
  if(!Array.isArray(arr))return '<div class="tip">AI 没有给出菜谱数组，换个说法再试</div>';
  const list=arr.filter(r=>r&&r.name&&(r.must||r.ingredients));
  if(!list.length)return '<div class="tip">没有生成有效方案，再点一次</div>';
  aiResults=list.map(r=>({

    must:(r.must||r.ingredients||[]).map(x=>typeof x==="string"?x:(x.name||"")),
    opt:(r.opt||[]).map(x=>typeof x==="string"?x:(x.name||"")),
    steps:(r.steps||[]).map(x=>typeof x==="string"?x:String(x)),
    tip:r.tip||""
  }));
  return aiResults.map((r,i)=>{
    const ok=r.must.filter(n=>BY[n]);
    const bad=r.must.filter(n=>!BY[n]);
    const dup=ALL().some(function(x){return x.n===r.name});
    const mac=rcpMacro({n:r.name,m:ok,o:r.opt||[]});
    return `<div class="rec" style="cursor:default">
      <div class="t"><b>${esc(r.name)}</b><em>${r.time||"?"} 分钟</em></div>
      <div class="d">${esc(r.desc||"")}</div>
      <div class="mac">${macLine(mac)}<span style="color:var(--ink4)"> · 本地库计算</span></div>
      <div class="badges">${dup?'<span class="badge mut">已在食谱库</span>':''}${ok.map(n=>`<span class="badge info">${esc(n)}</span>`).join("")}${bad.map(n=>`<span class="badge warn">库里没有：${esc(n)}</span>`).join("")}</div>
      <ol class="steps">${(r.steps||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      ${r.tip?`<div class="tip" style="font-size:12.5px;margin-top:6px">${esc(r.tip)}</div>`:""}
      <div class="btns" style="margin-top:10px">
        <button class="btn" onclick="adoptAI(${i})">采纳入库</button>
        <button class="btn ghost" onclick="this.closest('.rec').remove()">丢弃</button>

function shopGap(){
  const one={},two={};
  ALL().forEach(function(r){
    const miss=(r.m||[]).filter(function(n){return BY[n]&&!haveIng(n)});
    if(miss.length===1)one[miss[0]]=(one[miss[0]]||0)+1;   /* 只差这一样：买它就能多做几道 */
    else if(miss.length===2)miss.forEach(function(n){two[n]=(two[n]||0)+1});
  });
  /* 优先列"只差一样"的；一道都没有时退一步，列还差两样的 */
  const src=Object.keys(one).length?one:two,map={};
  Object.keys(src).forEach(function(n){map[n]={g:BY[n].ug||100,unlock:src[n]}});
  return map;
}

/* ===== 版本检查（v3.9 重做：多来源 + 失败可见） =====
   APK 的页面打包在 assets 里、没有 Service Worker，只能主动去线上要版本号。
   但 Pages 未必在每台手机的网络上都能到，所以依次试 Pages 的 version.json → GitHub API；

const UPD_REPO="pany83025-commits/dorm-meal-assistant";
const UPD_APK="https://github.com/"+UPD_REPO+"/releases/latest/download/dorm-meal.apk";
const UPD_SITE="https://pany83025-commits.github.io/dorm-meal-assistant/";
const UPD_IS_APP=!!(window.AndroidBridge&&window.AndroidBridge.httpGet);
const UPD_BASE=UPD_IS_APP?UPD_SITE:location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"");
const UPD_EVERY=3600e3;                    /* 自动检查间隔：1 小时 */

function verNum(v){return String(v||"").split(".").map(function(x){return parseInt(x,10)||0})}
function verNewer(a,b){                      /* a 比 b 新返回 true */
  const A=verNum(a),B=verNum(b);
  for(let i=0;i<Math.max(A.length,B.length);i++){
    const x=A[i]||0,y=B[i]||0;
    if(x!==y)return x>y;
  }
  return false;
}
function fetchText(url){
  if(UPD_IS_APP){
    let t;
    try{t=window.AndroidBridge.httpGet(url)}catch(e){throw new Error("桥接调用失败："+((e&&e.message)||e))}
    const str=String(t==null?"":t);
    if(str.indexOf("err:")===0)throw new Error(str.slice(4)||"没取到内容");
    if(!str)throw new Error("返回为空");
    return Promise.resolve(str);
  }
  return fetch(url,{cache:"no-store"}).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.text();
  });
}
/* 依次尝试的来源：Pages 的版本文件，APK 再多一个 GitHub API 兜底 */
function updSources(){
  const list=[{name:"Pages",url:UPD_BASE+"version.json",pick:function(t){return JSON.parse(t)}}];
  if(UPD_IS_APP)list.push({
    name:"GitHub API",
    url:"https://api.github.com/repos/"+UPD_REPO+"/releases/latest",
    pick:function(t){
      const d=JSON.parse(t);
      return {version:String(d.tag_name||"").replace(/^v/,""),note:d.name||""};
    }
  });
  return list;
}
function updSave(patch){
  S.upd=Object.assign({at:0,latest:"",note:"",src:"",newer:false,err:""},S.upd||{},patch);

function checkUpdate(force){
  const last=+(S.lastUpd||0);
  if(!force&&Date.now()-last<UPD_EVERY)return Promise.resolve({skipped:true});
  const srcs=updSources(),errs=[];
  function next(i){
    if(i>=srcs.length){
      updSave({at:Date.now(),err:errs.join("；")||"取不到版本信息"});
      return {ok:false,err:S.upd.err};
    }
    const src=srcs[i];
    return Promise.resolve().then(function(){return fetchText(src.url)}).then(function(txt){
      const d=src.pick(txt)||{};
      const v=String(d.version||"").trim();
      if(!v)throw new Error("返回里没有版本号");
      const newer=verNewer(v,APP_VER);
      S.lastUpd=Date.now();
      updSave({at:Date.now(),latest:v,note:d.note||"",src:src.name,newer:newer,err:""});
      if(newer)showUpdateNotice(v,d.note||"",d.apk||UPD_APK);
      return {ok:true,version:v,newer:newer,src:src.name};
    }).catch(function(e){
      errs.push(src.name+"："+((e&&e.message)||"失败"));
      return next(i+1);
    });
  }
  return Promise.resolve().then(function(){return next(0)});
}

  }
  h+='<div style="height:12px"></div><button class="btn" id="updBtn" onclick="manualCheckUpdate()">立即检查</button>';
  h+='<div style="height:8px"></div><button class="btn ghost" onclick="updOpen()">去下载页（GitHub）</button>';
  h+='<div style="height:8px"></div><button class="btn ghost" onclick="closeSheet()">关闭</button>';
  openSheet(h);
}
function manualCheckUpdate(){
  const b=$("updBtn");
  if(b){b.disabled=true;b.textContent="检查中…"}
  checkUpdate(true).then(function(r){
    sheetRedraw=1;openSetUpdate();
    if(r&&r.ok&&!r.newer)notice("已是最新版本 v"+APP_VER);
  },function(){
    sheetRedraw=1;openSetUpdate();
  });
}
/* 从后台切回来 / 重新可见时复查：APK 的 WebView 不会重新加载，靠这两个钩子 */
window.__onResume=function(){setTimeout(function(){checkUpdate(false)},500)};
document.addEventListener("visibilitychange",function(){
  if(!document.hidden)setTimeout(function(){checkUpdate(false)},500);
});
setTimeout(function(){checkUpdate(false)},2200);   /* 等开屏动画退场再查，免得提示被盖住 */



(function(){
  var el=document.getElementById("splash");
  if(!el)return;
  var seen=null;
  try{seen=sessionStorage.getItem("booted")}catch(e){}
  if(seen){ if(el.parentNode)el.parentNode.removeChild(el); return; }
  try{sessionStorage.setItem("booted","1")}catch(e){}
  setTimeout(function(){
    el.classList.add("out");
    setTimeout(function(){ if(el.parentNode)el.parentNode.removeChild(el); },440);
  },1760);
})();

/* 键盘避让：把系统给出的 IME 高度换算成页面需要让出的空间 */
window.__baseH=window.innerHeight;
window.__imeDp=0;
window.__setIme=function(dp){
  window.__imeDp=dp||0;
  applyKB();
};
function applyKB(){
  const sh=Math.max(0,(window.__baseH||window.innerHeight)-window.innerHeight);
  const kb=Math.max(0,(window.__imeDp||0)-sh);
  document.documentElement.style.setProperty("--kb",kb+"px");
}
window.addEventListener("resize",function(){
  if(!window.__imeDp)window.__baseH=window.innerHeight;
  applyKB();
});
window.addEventListener("scroll",function(){
  const hd=document.getElementById("hd");
  if(hd)hd.classList.toggle("scrolled",window.scrollY>4);
},{passive:true});
document.addEventListener("focusin",function(e){
  const t=e.target;
  if(!t||!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  setTimeout(function(){
    try{t.scrollIntoView({block:"center",behavior:"smooth"})}catch(_){}
  },300);
});

/* 返回键：有弹层先关弹层，没有才让系统退出 */
window.__onBack=function(){
  const sh=document.getElementById("sheet");
  if(sh&&sh.classList.contains("on")){sheetBack();return true}     /* 只退一层 */
  const pg=document.getElementById("page");
  if(pg&&pg.classList.contains("on")){closePage();return true}      /* 整页子视图先关掉，不能直接退 App */
  if(typeof tab!=="undefined"&&tab==="set"){setTab("log");return true}
  if(typeof tab!=="undefined"&&tab!=="today"){setTab("today");return true}
  return false;
};

/* 弹层手势：只保留「向右滑＝退一层」。
   下拉关闭已经去掉——短弹层里内下滑太容易误触，退出请用右上角 × 或返回键。 */
(function(){
  const sh=document.getElementById("sheet");
  if(!sh)return;
  let sx=0,sy=0,t0=0,dir="",box=null,lastX=0,lastY=0;
  sh.addEventListener("touchstart",function(e){
    if(e.touches.length!==1){box=null;return}
    box=sh.querySelector(".box");
    if(box){box.style.transition="none";box.style.animation=""}
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    lastX=sx;lastY=sy;t0=Date.now();dir="";
  },{passive:true});
  sh.addEventListener("touchmove",function(e){
    if(!box||e.touches.length!==1)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
    if(!dir){
      /* 只认横向意图；纵向一律交给弹层自己滚动 */
      if(dx>14&&Math.abs(dx)>Math.abs(dy)*1.1)dir="right";
      else if(Math.abs(dx)>10||Math.abs(dy)>10)dir="none";
    }
    if(dir==="right"&&dx>0){
      box.style.transform="translateX("+dx+"px)";
      if(e.cancelable)e.preventDefault();
    }
  },{passive:false});
  function rebound(){
    if(!box)return;
    box.style.transition="transform .3s cubic-bezier(.22,1,.36,1)";
    box.style.transform="";
    const b=box;
    setTimeout(function(){if(b)b.style.transition=""},320);
  }
  sh.addEventListener("touchend",function(e){
    if(!box)return;
    const t=e.changedTouches?e.changedTouches[0]:{clientX:lastX,clientY:lastY};
    const dx=t.clientX-sx,dy=t.clientY-sy,dt=Math.max(1,Date.now()-t0);
    const vx=dx/dt;
    if(dir==="right"&&(dx>110||(dx>70&&vx>0.5))){box.style.transform="";sheetBack();}
    else rebound();
    dir="";box=null;
  },{passive:true});
  sh.addEventListener("touchcancel",function(){rebound();dir="";box=null},{passive:true});
})();
</script>
